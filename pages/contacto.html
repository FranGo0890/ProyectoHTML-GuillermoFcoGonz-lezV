<body>
    <header>
        <h1>Contacto y Presupuestos</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Envianos tu consulta</h2>
            <p>Completá el formulario para solicitar un presupuesto a medida según los metros de guirnalda que necesites.</p>
            
            <form action="#" method="POST">
                <div>
                    <label for="nombre">Nombre y Apellido:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                </div>
                <br>
                <div>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
                </div>
                <br>
                <div>
                    <label for="mensaje">Mensaje / Metros requeridos:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Contanos qué tipo de luz preferís..."></textarea>
                </div>
                <br>
                <div>
                    <button type="submit">Enviar Consulta</button>
                </div>
            </form>
        </section>
    </main>
